[project]
name = "hive-bot"
version = "0.1.0"
description = "AlphaZero-style MCTS + PyTorch bot for the board game Hive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    # tqdm.auto needs this to render as a real notebook widget (Colab,
    # Jupyter, VS Code) instead of silently falling back to a plain-text
    # bar that doesn't always render cleanly in a notebook cell's output.
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
# Only needed by tests/reference (the vendored oracle engine) -- kept out of
# the runtime engine's dependency set on purpose, see plan doc / README.
reference = [
    "pydantic>=2",
]
# onnx: only needed by export/onnx_export.py's post-export verification
# step. onnxscript: torch's default (dynamo-based) ONNX exporter requires
# it as of torch 2.13, even without explicitly requesting dynamo=True.
export = [
    "onnx>=1.15",
    "onnxscript>=0.1",
]
# Only needed by scripts/scrape_hivegame_archive.py -- see the plan doc
# ("Bootstrap training from real hivegame.com games"). playwright drives a
# real browser against the live site (its archive search is a Leptos
# server function, not a documented REST API); cbor2 decodes the
# intercepted responses (application/cbor).
scrape = [
    "playwright>=1.45",
    "cbor2>=5.6",
]

[dependency-groups]
dev = [
    "hive-bot[reference]",
    "hive-bot[export]",
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "types-tqdm>=4.66",
    # For test_onnx_export.py's numeric-parity check against PyTorch's own
    # forward() -- not needed at runtime by anything shipped.
    "onnxruntime>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_bot"]

[tool.ruff]
line-length = 92
target-version = "py312"
# tests/reference is a vendored, unmodified copy of another repo's code kept
# only as a correctness oracle -- deliberately not linted/reformatted so it
# stays a clean diff against its source.
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["hive_bot"]
mypy_path = "src"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "hive_bot.training.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exhaustive/property-based tests too slow for the default run (see `make test-full`)",
]
addopts = "-m 'not slow'"
